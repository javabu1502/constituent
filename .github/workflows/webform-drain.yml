name: Webform delivery worker

# Files queued constituent messages in non-CWC Senate offices' own contact
# forms (Playwright cannot run on Vercel). Dark until the repository secret
# WEBFORM_DELIVERY_ENABLED is set to "true".
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: webform-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Drain the webform queue
        env:
          WEBFORM_DELIVERY_ENABLED: ${{ secrets.WEBFORM_DELIVERY_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CWC_ENV_FILE: /dev/null
        run: npx tsx scripts/webform-drain.ts
