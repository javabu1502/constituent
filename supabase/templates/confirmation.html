<!doctype html>
<html lang="en">
  <body style="margin:0;background:#F8F6F1;font-family:Archivo,Helvetica,Arial,sans-serif;color:#1A1A18">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <p style="margin:0 0 28px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#6B5B3E">
        My Democracy
      </p>

      <h1 style="margin:0 0 12px;font-size:28px;line-height:1.15;letter-spacing:-0.02em;font-weight:800">
        Confirm your email
      </h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#3A3A35">
        Enter this code on the page you left open to finish creating your account. It expires in an hour.
      </p>

      <p style="margin:0 0 24px;padding:20px;background:#FFFEFB;border:1px solid #DCD7CA;text-align:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:34px;font-weight:600;letter-spacing:0.3em">
        {{ .Token }}
      </p>

      <p style="margin:0;font-size:13px;line-height:1.6;color:#6B5B3E">
        If you did not ask to sign in, you can ignore this email. Nobody can use the code without it.
      </p>
    </div>
  </body>
</html>
